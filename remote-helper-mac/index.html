<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiretalk Remote Helper</title>
    <style>
        body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .wrap { padding: 24px; }
        h1 { margin: 0 0 8px; font-size: 1.25rem; }
        p { margin: 0 0 16px; color: #94a3b8; line-height: 1.5; font-size: 0.92rem; }
        label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #111827; color: #f8fafc; margin-bottom: 12px; }
        button { width: 100%; border: none; border-radius: 999px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: #16a34a; color: white; }
        .status { margin-top: 14px; min-height: 20px; font-size: 0.84rem; }
        .status.ok { color: #86efac; }
        .status.err { color: #fca5a5; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Wiretalk Remote Helper</h1>
    <p>Enter the pairing code from your support agent. This app shares your screen and allows the agent to control your PC after you connect.</p>
    <label for="api-base">Wiretalk server URL</label>
    <input id="api-base" type="url" placeholder="https://your-wiretalk-domain.com">
    <label for="pairing-code">Pairing code</label>
    <input id="pairing-code" type="text" placeholder="ABC-123" autocomplete="one-time-code">
    <label for="host-name">PC name (optional)</label>
    <input id="host-name" type="text" placeholder="Visitor PC">
    <button id="connect-btn" type="button">Connect</button>
    <div id="status" class="status"></div>
</div>
<script src="./node_modules/socket.io/client-dist/socket.io.min.js"></script>
<script type="module" src="./renderer.js"></script>
</body>
</html>
